<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Auto Flow Connector</title>
  <style>
    body { 
      width: 260px; 
      margin: 0; 
      padding: 15px; 
      background-color: #0E0E10; 
      color: #eef3fc; 
      font-family: system-ui, sans-serif; 
      text-align: center; 
    }
    .icon { 
      width: 40px; 
      height: 40px; 
      background: linear-gradient(135deg, #10B981, #3B82F6); 
      border-radius: 10px; 
      margin: 0 auto 10px auto; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 20px; 
    }
    h3 { margin: 0 0 15px 0; font-size: 15px; color: #10B981; }
    input { 
      box-sizing: border-box; 
      width: 100%; 
      padding: 8px; 
      margin-bottom: 10px; 
      border-radius: 6px; 
      border: 1px solid #2A2A30; 
      background: #15151A; 
      color: white; 
      font-size: 12px; 
    }
    button { 
      width: 100%; 
      padding: 10px; 
      border: none; 
      border-radius: 6px; 
      background: #3B82F6; 
      color: white; 
      font-weight: bold; 
      cursor: pointer; 
      transition: 0.2s; 
    }
    button:hover { background: #2563EB; }
    #status { 
      margin-top: 10px; 
      font-size: 11px; 
      color: #34d399; 
      font-weight: bold; 
      display: none; 
    }
  </style>
</head>
<body>
  <div class="icon">⚡</div>
  <h3>Đồng Bộ Tài Khoản Flow</h3>
  
  <input type="text" id="input-user-id" placeholder="Nhập Mã Kết Nối (Từ Web App)..." />
  
  <button id="btn-push">Đẩy Cookie lên Web App</button>
  <div id="status"></div>

  <!-- Gọi file logic xử lý -->
  <script src="popup.js"></script>
</body>
</html>
